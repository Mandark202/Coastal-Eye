<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0F33"/>
      <stop offset="100%" stop-color="#0D0716"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6C2BF2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E2B714"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#6C2BF2" stroke-width="6" opacity="0.4"/>

  <!-- Radar Arc Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="8 8" opacity="0.35"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#8B5CF6" stroke-width="4" opacity="0.45"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Threat Radar Sweep Triangle -->
  <path d="M 256 256 L 410 160 A 180 180 0 0 0 256 76 Z" fill="url(#purpleGrad)" opacity="0.18"/>

  <!-- Coastal Ocean Waves (Stylized) -->
  <path d="M 120 330 C 160 300, 200 350, 256 320 C 312 290, 352 340, 392 310" 
        fill="none" stroke="url(#purpleGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 100 380 C 150 350, 200 400, 256 370 C 312 340, 362 390, 412 360" 
        fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round" opacity="0.75"/>

  <!-- Central Emergency Beacon / Lighthouse Motif -->
  <g filter="url(#glow)">
    <!-- Beacon Base -->
    <polygon points="230,270 282,270 274,180 238,180" fill="#EDEAFB" opacity="0.95"/>
    <rect x="234" y="166" width="44" height="14" rx="4" fill="#6C2BF2"/>
    <circle cx="256" cy="150" r="16" fill="url(#goldGrad)"/>
    <polygon points="244,142 268,142 256,124" fill="url(#goldGrad)"/>
    <!-- Warning Light Pulses -->
    <line x1="256" y1="110" x2="256" y2="92" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="220" y1="126" x2="204" y2="114" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <line x1="292" y1="126" x2="308" y2="114" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- SOS / Pulse Core -->
  <circle cx="256" cy="256" r="14" fill="url(#goldGrad)" filter="url(#glow)"/>
</svg>
